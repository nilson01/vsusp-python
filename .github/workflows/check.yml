name: Package checks
on:
  push:
    paths-ignore: ["docs/**", "**/*.md", "mkdocs.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "mkdocs.yml"]
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  test:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install wheel and test dependencies
        shell: python
        run: |
          import glob, subprocess, sys
          constraints = ["-c", ".github/minimum-constraints.txt"] if "${{ matrix.python }}" == "3.10" else []
          subprocess.run([sys.executable, "-m", "pip", "install", *constraints,
                          *glob.glob("dist/*.whl"), "pytest", "matplotlib", "arviz"], check=True)
          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
      - name: Test installed package outside checkout
        shell: python
        run: |
          import os, shutil, subprocess, sys
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "vsusp-tests"
          shutil.copytree("tests", target, dirs_exist_ok=True)
          subprocess.run([sys.executable, "-m", "pytest", str(target), "-q"],
                         cwd=target.parent, check=True)
