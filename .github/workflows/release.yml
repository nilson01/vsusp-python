name: TestPyPI release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testpypi-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check installed wheel outside checkout
        shell: python
        run: |
          import glob, os, shutil, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, '-m', 'pip', 'install',
                          *glob.glob('dist/*.whl'), 'pytest', 'matplotlib', 'arviz'], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'check'], check=True)
          target = Path(os.environ['RUNNER_TEMP']) / 'vsusp-release-tests'
          shutil.copytree('tests', target, dirs_exist_ok=True)
          subprocess.run([sys.executable, '-m', 'pytest', str(target), '-q'],
                         cwd=target.parent, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/vsusp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
