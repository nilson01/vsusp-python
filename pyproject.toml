[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsusp"
version = "0.1.0"
description = "Variable selection from shrinkage-prior posterior draws"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Nilson Chapagain"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]

[project.urls]
Repository = "https://github.com/nilson01/vsusp-python"
Documentation = "https://nilson01.github.io/vsusp-python/"
Issues = "https://github.com/nilson01/vsusp-python/issues"

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
diagnostics = ["arviz>=0.18"]
docs = ["mkdocs>=1.5"]
test = ["pytest>=8", "matplotlib>=3.7", "arviz>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
